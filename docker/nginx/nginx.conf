# =============================================================================
# AXÉMAP — nginx.conf (PRODUÇÃO)
#
# Reverse proxy único ponto de entrada (portas 80/443).
# Apenas este serviço é exposto à Internet. api (3001), web (3000),
# postgres, redis e storage ficam na rede interna (axemap_internal).
#
# Domínios:
#   axemap.com.br         -> web (Next.js)           + /api/* -> api
#   www.axemap.com.br     -> 301 -> axemap.com.br
#   api.axemap.com.br     -> api (NestJS)
#   storage.axemap.com.br -> storage (MinIO, path-style)
#
# Certificados: /etc/nginx/certs/fullchain.pem + privkey.pem
# (volume ./nginx/certs, gitignorado). Um único certificado com SAN cobre os
# 4 domínios — gerar com certbot: certbot certonly --webroot
#   -w /var/www/certbot -d axemap.com.br -d www.axemap.com.br \
#   -d api.axemap.com.br -d storage.axemap.com.br
# O volume ./nginx/www (webroot) também é gitignorado.
# =============================================================================

# ─── HTTP → HTTPS (exceto ACME e healthcheck) ───────────────────────────────
server {
    listen 80;
    server_name axemap.com.br www.axemap.com.br api.axemap.com.br storage.axemap.com.br;

    # Let's Encrypt / ACME (webroot montado de ./nginx/www)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck do container nginx (via HTTP, usado pelo compose healthcheck)
    location = /healthz {
        access_log off;
        proxy_pass http://api:3001/api/v1/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── www → apex (preserva path e query) ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.axemap.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://axemap.com.br$request_uri;
}

# ─── axemap.com.br — Web + API + legacy /files ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name axemap.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 110m;

    # API NestJS (compat com chamadas same-origin do web)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks (usado pelo nginx healthcheck e por scripts)
    location = /healthz {
        access_log off;
        proxy_pass http://api:3001/api/v1/health;
    }

    # Legacy: arquivos públicos servidos antes do subdomínio storage
    location /files/ {
        proxy_pass http://storage:9000/;
        proxy_set_header Host $host;
    }

    # Next.js (restante)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── api.axemap.com.br — API (NestJS) ───────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.axemap.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 110m;

    # Health checks
    location = /healthz {
        access_log off;
        proxy_pass http://api:3001/api/v1/health;
    }

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── storage.axemap.com.br — MinIO (path-style) ─────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name storage.axemap.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 110m;

    # Health check do MinIO
    location = /minio/health/live {
        proxy_pass http://storage:9000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://storage:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
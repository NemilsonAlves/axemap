# =============================================================================
# AXÉMAP — nginx.conf (TEMPLATE para produção)
#
# Reverse proxy único ponto de entrada (portas 80/443).
# Apenas este serviço é exposto à internet. api (3001), web (3000),
# postgres, redis e storage ficam na rede interna.
#
# ⚠️ Troque os exemplos abaixo pelo domínio real quando disponível.
# ⚠️ Certificados TLS: via Cloudflare Origin / certbot / CA real.
# =============================================================================

# HTTP → HTTPS (exceto ACME/.well-known)
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 110m;

    # API NestJS
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks
    location = /healthz {
        access_log off;
        proxy_pass http://api:3001/api/v1/health;
    }

    # Storage público (arquivos públicos)
    location /files/ {
        proxy_pass http://storage:9000/;
        proxy_set_header Host $host;
    }

    # Next.js (restante)
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
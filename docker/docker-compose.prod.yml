# =============================================================================
# AXÉMAP — docker-compose.prod.yml (TEMPLATE DE PRODUÇÃO)
#
# ⚠️ ESTE ARQUIVO É UM MODELO. NÃO use com valores reais sem revisão.
# ⚠️ NÃO contém secrets — todos os valores vêm do ambiente (${VAR}).
# ⚠️ Só deve ser usado quando a VPS e a infraestrutura definitiva existirem.
#
# Modo de uso (quando a VPS estiver disponível):
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Superfície de exposição à Internet: SOMENTE as portas 80/443 do nginx.
# postgres (5432), redis (6379) e storage (9000) ficam ligados em 127.0.0.1
# do host — JUSTIFICATIVA: permitem backup/restore e migrate-deploy executados
# a partir do host (scripts/*.sh) sem expor nada à rede pública.
# O console administrativo do MinIO (9001) NÃO é publicado em nenhuma porta.
# =============================================================================

name: axemap-prod

# Rotação de logs: evita disco cheio na VPS (96 GB) com logs JSON infinitos.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - axemap_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      # NEXT_PUBLIC_* é incorporado ao bundle no "next build".
      # Passar via build ARG (não como variável de runtime).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TV_MUSIC_URL: ${NEXT_PUBLIC_TV_MUSIC_URL:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - axemap_internal
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados reais vivem FORA do Git (docker/nginx/certs/ é gitignorado).
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot do certbot (desafios ACME) — docker/nginx/www é gitignorado.
      - ./nginx/www:/var/www/certbot
    healthcheck:
      # /healthz existe no bloco HTTP (porta 80) — verifica api+nginx sem TLS.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - axemap_internal
    depends_on:
      - api
      - web

  postgres:
    # Mesmo major da dev (postgis/postgis:17-3.5) — migrations geradas em dev
    # são executadas em prod; versões distintas podem gerar SQL incompatível.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *default-logging
    # Ligado apenas em 127.0.0.1 do host — justificativa: backup/restore e
    # migrate-deploy rodam no host (scripts/*.sh). NUNCA expor à Internet.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - axemap_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Ligado apenas em 127.0.0.1 do host — justificativa: tooling de backup/ops
    # no host. NUNCA expor à Internet.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - axemap_internal

  storage:
    # TODO antes do go-live: pinar para um RELEASE específico (ex.: RELEASE.2025-04-22T22-12-26Z)
    # em vez de latest — reproduzibilidade. `latest` é aceitável para testes.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    # Porta 9000 ligada apenas em 127.0.0.1 do host (proxy nginx usa a rede
    # interna). O console administrativo (9001) NÃO é publicado.
    ports:
      - "127.0.0.1:9000:9000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      # MinIO não tem curl na imagem. "mc ready local" é o mecanismo oficial
      # (o alias "local" é configurado pela imagem a partir de MINIO_ROOT_*).
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axemap_internal

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  axemap_internal:
    driver: bridge
# =============================================================================
# AXÉMAP — docker-compose.prod.yml (TEMPLATE DE PRODUÇÃO)
#
# ⚠️ ESTE ARQUIVO É UM MODELO. NÃO use com valores reais sem revisão.
# ⚠️ NÃO contém secrets — todos os valores vêm do ambiente (${VAR}).
# ⚠️ Só deve ser usado quando a VPS e a infraestrutura definitiva existirem.
#
# Serviços externos (PostgreSQL, Redis, MinIO) NÃO devem ser expostos à
# internet pública. Apenas a porta 80/443 do reverse proxy (nginx) é pública.
#
# Modo de uso (quando a VPS estiver disponível):
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================

name: axemap-prod

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      MAIL_API_URL: ${MAIL_API_URL}
      MAIL_API_KEY: ${MAIL_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - axemap_internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks:
      - axemap_internal
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - axemap_internal
    depends_on:
      - api
      - web

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # ⚠️ NÃO expor a porta 5432 publicamente. Só para o host de backup.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axemap_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ⚠️ NÃO expor a porta 6379 publicamente.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - axemap_internal

  storage:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    # ⚠️ Só a porta 9000 (API) pode ser exposta via proxy; 9001 (console) NÃO.
    ports:
      - "127.0.0.1:9000:9000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axemap_internal

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  axemap_internal:
    driver: bridge
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: axemap-postgres
    environment:
      POSTGRES_USER: axemap
      POSTGRES_PASSWORD: axemap_dev
      POSTGRES_DB: axemap_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axemap -d axemap_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - axemap

  redis:
    image: redis:7-alpine
    container_name: axemap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - axemap

  adminer:
    image: adminer:latest
    container_name: axemap-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: axemap_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axemap

  redisinsight:
    image: redis/redisinsight:latest
    container_name: axemap-redisinsight
    ports:
      - "5540:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    networks:
      - axemap

volumes:
  postgres_data:
    name: axemap_postgres_data
  redis_data:
    name: axemap_redis_data
  redisinsight_data:
    name: axemap_redisinsight_data

networks:
  axemap:
    name: axemap_dev
    driver: bridge

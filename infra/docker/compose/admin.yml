services:
  adminer:
    image: adminer:latest
    container_name: axemap-adminer
    profiles: [admin]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: axemap_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axemap

  redisinsight:
    image: redis/redisinsight:latest
    container_name: axemap-redisinsight
    profiles: [admin]
    ports:
      - "5540:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    networks:
      - axemap

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: axemap-pgadmin
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@axemap.com.br
      PGADMIN_DEFAULT_PASSWORD: axemap_admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axemap

volumes:
  redisinsight_data:
    name: axemap_redisinsight_data
  pgadmin_data:
    name: axemap_pgadmin_data

networks:
  axemap:
    external: true
    name: axemap_dev

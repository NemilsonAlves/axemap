services:
  ollama:
    image: ollama/ollama:latest
    container_name: axemap-ollama
    profiles: [ai]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - axemap

volumes:
  ollama_data:
    name: axemap_ollama_data

networks:
  axemap:
    external: true
    name: axemap_dev

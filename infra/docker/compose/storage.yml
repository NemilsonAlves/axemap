services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: axemap-minio
    profiles: [storage]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: axemap
      MINIO_ROOT_PASSWORD: axemap_minio_dev
      MINIO_DOMAIN: localhost
    volumes:
      - minio_data:/data
      - ../../storage/minio/init.sh:/docker-entrypoint-init.d/init.sh:ro
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - axemap

volumes:
  minio_data:
    name: axemap_minio_data

networks:
  axemap:
    external: true
    name: axemap_dev

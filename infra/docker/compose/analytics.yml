services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: axemap-clickhouse
    profiles: [analytics]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - axemap

volumes:
  clickhouse_data:
    name: axemap_clickhouse_data

networks:
  axemap:
    external: true
    name: axemap_dev

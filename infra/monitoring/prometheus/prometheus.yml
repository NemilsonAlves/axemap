global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "axemap-api"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: "api"
          environment: "development"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres"
    static_configs:
      - targets: ["host.docker.internal:9187"]
        labels:
          service: "postgres"

  - job_name: "redis"
    static_configs:
      - targets: ["host.docker.internal:9121"]
        labels:
          service: "redis"

  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: "node"
